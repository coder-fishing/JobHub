    spring.application.name=Demo_Prj_Intern

    spring.config.import=optional:file:.env[.properties]

# # 1. Cấu hình kết nối MySQL
# spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_v1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.username=root
# spring.datasource.password=123456789
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
    server.port=8080

    # 1. Cấu hình kết nối MySQL
    spring.datasource.url=jdbc:mysql://localhost:3306/freelancer_v1?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    spring.datasource.username=root
    spring.datasource.password=${MYSQL_PASSWORD:root}
    spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

    # 2. Cấu hình Spring Data JPA & Hibernate
    spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
    spring.jpa.hibernate.ddl-auto=update
    spring.jpa.show-sql=true
    spring.jpa.properties.hibernate.format_sql=true

    # 3. OAuth2 Google Client
    spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
    spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
    spring.security.oauth2.client.registration.google.scope=email,profile

    # 4. Frontend Integration
    app.frontend.redirect-uri=http://localhost:3000/oauth2/redirect

    # 5. JWT Config
    app.jwt.secret=${JWT_SECRET}
    app.jwt.expiration=86400000

    # 6. Cloudinary upload config
    cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
    cloudinary.api-key=${CLOUDINARY_API_KEY}
    cloudinary.api-secret=${CLOUDINARY_API_SECRET}

    # 7. Mail (SMTP) Config
    spring.mail.host=smtp.gmail.com
    spring.mail.port=587
    spring.mail.username=${MAIL_USERNAME:test@gmail.com}
    spring.mail.password=${MAIL_PASSWORD:}
    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true


    # 8. OTP Config
    app.otp.secret=${OTP_SECRET}
